workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - firebase_credentials
        - android_signing
      vars:
        PACKAGE_NAME: "com.example.member_attendance"
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Set up .env file
        script: |
          if [ -z "$ENV_FILE_CONTENT" ]; then 
            echo "Error: ENV_FILE_CONTENT is empty or group is not loaded"
            exit 1
          fi
          mkdir -p assets
          printf "%s\n" "$ENV_FILE_CONTENT" > assets/env
          echo "Verifying assets/env content:"
          cat assets/env

      - name: Set up Keystore
        script: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf "%s" "$KEYSTORE_BASE64" | base64 --decode > /tmp/upload-keystore.jks
          fi

      - name: Set up Google Service Account
        script: |
          if [ -n "$CREDENTIAL_FILE_CONTENT" ]; then
            printf "%s" "$CREDENTIAL_FILE_CONTENT" > /tmp/firebase_credentials.json
          fi

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Flutter analyze
        script: |
          flutter analyze

      - name: Flutter unit tests
        script: |
          flutter test

      - name: Build Android APK
        script: |
          flutter build apk --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER
        environment:
          KEYSTORE_PATH: "/tmp/upload-keystore.jks"

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

    publishing:
      firebase_app_distribution:
        app_id: $FIREBASE_APP_ID
        service_account_credentials: $CREDENTIAL_FILE_CONTENT
        groups:
          - internal-testers
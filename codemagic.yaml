workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - firebase_credentials
        - android_signing
      vars:
        PACKAGE_NAME: "com.example.member_attendance"
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Set up environment and build
        script: |
          echo "Current working directory: $(pwd)"
          
          # 1. Overwrite app_config.properties placeholder
          echo "Setting up assets/app_config.properties..."
          if [ -z "$ENV_FILE_CONTENT" ]; then 
            echo "Error: ENV_FILE_CONTENT is empty. Ensure 'firebase_credentials' group is associated with this workflow."
            exit 1
          fi
          printf -- "%s\n" "$ENV_FILE_CONTENT" > assets/app_config.properties
          ls -la assets/app_config.properties
          echo "File size: $(wc -c < assets/app_config.properties) bytes"
          
          # 2. Set up Keystore
          echo "Setting up keystore..."
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Error: KEYSTORE_BASE64 is empty. Ensure 'android_signing' group is associated."
            exit 1
          fi
          printf -- "%s" "$KEYSTORE_BASE64" | base64 --decode > /tmp/upload-keystore.jks
          ls -la /tmp/upload-keystore.jks

          # 3. Set up Google Service Account
          echo "Setting up Google Service Account..."
          if [ -z "$CREDENTIAL_FILE_CONTENT" ]; then
            echo "Error: CREDENTIAL_FILE_CONTENT is empty. Ensure 'firebase_credentials' group is associated."
            exit 1
          fi
          printf -- "%s" "$CREDENTIAL_FILE_CONTENT" > /tmp/firebase_credentials.json
          ls -la /tmp/firebase_credentials.json

          # 4. Flutter Build
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER
        environment:
          KEYSTORE_PATH: "/tmp/upload-keystore.jks"

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

    publishing:
      firebase_app_distribution:
        app_id: $FIREBASE_APP_ID
        service_account_credentials: $CREDENTIAL_FILE_CONTENT
        groups:
          - internal-testers
workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - firebase_credentials
        - android_signing
      vars:
        PACKAGE_NAME: "com.example.member_attendance"
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Set up .env file
        script: |
          echo "Setting up assets/app.env..."
          if [ -z "$ENV_FILE_CONTENT" ]; then 
            echo "Error: ENV_FILE_CONTENT is empty or group 'firebase_credentials' is not loaded in Codemagic UI."
            exit 1
          fi
          mkdir -p assets
          printf -- "%s\n" "$ENV_FILE_CONTENT" > assets/app.env
          echo "Verifying assets/app.env:"
          ls -la assets/app.env
          echo "File size: $(wc -c < assets/app.env) bytes"
          # cat assets/app.env # Uncomment only for temporary debugging of secret content

      - name: Set up Keystore
        script: |
          echo "Setting up keystore..."
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Error: KEYSTORE_BASE64 is empty. Ensure 'android_signing' group is loaded."
            exit 1
          fi
          printf -- "%s" "$KEYSTORE_BASE64" | base64 --decode > /tmp/upload-keystore.jks
          ls -la /tmp/upload-keystore.jks

      - name: Set up Google Service Account
        script: |
          echo "Setting up Google Service Account..."
          if [ -z "$CREDENTIAL_FILE_CONTENT" ]; then
            echo "Error: CREDENTIAL_FILE_CONTENT is empty. Ensure 'firebase_credentials' group is loaded."
            exit 1
          fi
          printf -- "%s" "$CREDENTIAL_FILE_CONTENT" > /tmp/firebase_credentials.json
          ls -la /tmp/firebase_credentials.json

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Flutter analyze
        script: |
          flutter analyze

      - name: Flutter unit tests
        script: |
          flutter test

      - name: Build Android APK
        script: |
          flutter build apk --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER
        environment:
          KEYSTORE_PATH: "/tmp/upload-keystore.jks"

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

    publishing:
      firebase_app_distribution:
        app_id: $FIREBASE_APP_ID
        service_account_credentials: $CREDENTIAL_FILE_CONTENT
        groups:
          - internal-testers